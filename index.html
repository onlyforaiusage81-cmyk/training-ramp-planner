<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Training Ramp Planner</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f4f6fb;margin:0;padding:0}
.container{max-width:900px;margin:40px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
h1{margin-bottom:10px}
button{padding:12px 18px;border:none;border-radius:8px;background:#1d4ed8;color:#fff;font-weight:bold;cursor:pointer}
.run-status{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:10px;background:#eef2ff;margin-top:20px;display:none}
.run-dot{width:10px;height:10px;border-radius:50%;background:#1d4ed8;margin-right:10px}
.run-left{display:flex;align-items:center}
.run-timer{font-weight:bold}
</style>
</head>
<body>

<div class="container">
<h1>Training Ramp Planner</h1>

<button onclick="sendToWebhook()">Generate Execution Plan</button>

<div id="runStatusCard" class="run-status">
<div class="run-left">
<div class="run-dot" id="runDot"></div>
<div>
<div id="runTitle">Preparing...</div>
<div id="runSub" style="font-size:12px;color:#555">Please wait...</div>
</div>
</div>
<div id="runTimer" class="run-timer">00:00</div>
</div>

</div>

<script>

window.__plannerPayload = {
  demo: "sample payload"
};

async function sendToWebhook(){
  const webhookUrl = "https://n8n-hnvg.onrender.com/webhook/training-ramp-batch-planner";

  const statusCard = document.getElementById('runStatusCard');
  const runTitle = document.getElementById('runTitle');
  const runSub = document.getElementById('runSub');
  const runTimer = document.getElementById('runTimer');
  const runDot = document.getElementById('runDot');

  let openBtn = document.getElementById('openPlanBtn');
  if (openBtn) openBtn.remove();

  let seconds = 0;
  let timerHandle = null;

  function formatTime(total){
    const mm = String(Math.floor(total / 60)).padStart(2, '0');
    const ss = String(total % 60).padStart(2, '0');
    return `${mm}:${ss}`;
  }

  function showStatus(title, sub, tone='working'){
    statusCard.style.display = 'flex';
    runTitle.textContent = title;
    runSub.textContent = sub;

    if (tone === 'success') {
      runDot.style.background = '#15803d';
    } else if (tone === 'error') {
      runDot.style.background = '#dc2626';
    } else {
      runDot.style.background = '#1d4ed8';
    }
  }

  try {
    showStatus('Building execution plan...', 'Processing...', 'working');

    runTimer.textContent = '00:00';

    timerHandle = setInterval(() => {
      seconds++;
      runTimer.textContent = formatTime(seconds);
    }, 1000);

    const res = await fetch(webhookUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(window.__plannerPayload)
    });

    const raw = await res.text();

    if (!res.ok) {
      throw new Error(raw);
    }

    let data = raw ? JSON.parse(raw) : null;

    if (!data || !data.spreadsheetUrl) {
      throw new Error("No spreadsheet URL returned");
    }

    clearInterval(timerHandle);

    showStatus('Plan ready', 'Click below to open', 'success');

    const btn = document.createElement('button');
    btn.id = 'openPlanBtn';
    btn.innerText = 'Open Execution Plan';
    btn.style.marginTop = '10px';
    btn.onclick = () => window.open(data.spreadsheetUrl, '_blank');

    statusCard.appendChild(btn);

  } catch (e) {
    if (timerHandle) clearInterval(timerHandle);
    showStatus('Error', e.message, 'error');
    alert(e.message);
  }
}

</script>

</body>
</html>
